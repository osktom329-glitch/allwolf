<style>
/* 夜の一画面アプリ。藍の夜空に月白の文字、太陽の石だけが金色に灯る。1列・端末を回す前提で親指で押せる大きさ */
:root {
  --night: #0e1822;      /* 地 */
  --night-2: #152331;    /* 面 */
  --night-3: #1d3042;    /* 浮き */
  --line: #2b4256;
  --bone: #ebe4d3;       /* 本文 */
  --mist: #9fb0bd;       /* 補足 */
  --moon: #c9dde3;       /* 強調・選択 */
  --sun: #e8b448;        /* 金（継承・買収） */
  --blood: #e0705a;      /* 死・襲撃 */
  --ward: #7fc4a4;       /* 防衛 */
  --rage: #c99be6;       /* 狂襲 */
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--bone); font-family: var(--body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 34rem; margin: 0 auto; padding-block: 1.25rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .02em; }
h1 { font-size: 2.6rem; font-weight: 800; line-height: 1.1; }
h2 { font-size: 1.5rem; line-height: 1.3; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; color: var(--mist); }
.muted { color: var(--mist); font-size: .9rem; }
.panel { background: var(--night-2); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .7rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: .6rem; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: .45rem .95rem; min-height: 2.6rem; color: var(--bone); }
.chip[aria-pressed="true"] { background: var(--moon); color: var(--night); border-color: var(--moon); font-weight: 700; }
.chip.kill[aria-pressed="true"] { background: var(--blood); border-color: var(--blood); color: #1a0d0a; }
.chip.gold[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: #231803; }
.chip:disabled { opacity: .35; cursor: default; }
.primary { background: var(--bone); color: var(--night); border: 0; border-radius: 10px; padding: .95rem; font-weight: 700; font-size: 1.05rem; width: 100%; }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: .7rem; width: 100%; color: var(--mist); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
input[type=text] { width: 100%; box-sizing: border-box; background: var(--night); border: 1px solid var(--line); color: var(--bone); border-radius: 8px; padding: .6rem .7rem; font: inherit; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem; }
.role { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .2rem .9rem; align-items: center; }
.role .glyph { font-size: 2.4rem; grid-row: span 2; line-height: 1; }
.role h2 { font-size: 1.6rem; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.tag { font-size: .8rem; border: 1px solid var(--line); border-radius: 6px; padding: .1rem .5rem; color: var(--moon); }
.tag.inh { border-color: var(--sun); color: var(--sun); }
.notice { white-space: pre-line; border-left: 3px solid var(--moon); padding-left: .7rem; }
.sun { color: var(--sun); }
.blood { color: var(--blood); }
.ward { color: var(--ward); }
.optrow { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }
.optrow > span { min-width: 0; }
.intel { width: 100%; border-collapse: collapse; font-size: .9rem; }

.dead { opacity: .45; text-decoration: line-through; }
.handoff { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1.2rem; text-align: center; }
.handoff .moon { width: 5.5rem; height: 5.5rem; border-radius: 50%; background: var(--moon); box-shadow: inset -1.4rem -.6rem 0 0 var(--night-3); }
.handoff .who { font-family: var(--display); font-size: 2.2rem; font-weight: 800; }
.victims { display: flex; flex-direction: column; gap: .4rem; }
.victim { display: flex; justify-content: space-between; gap: 1rem; font-size: 1.15rem; font-family: var(--display); }
.log { font-size: .8rem; color: var(--mist); white-space: pre-wrap; max-height: 18rem; overflow: auto; background: var(--night); border-radius: 8px; padding: .6rem; }
details > summary { cursor: pointer; color: var(--moon); }
.rules { display: flex; flex-direction: column; gap: .9rem; margin-top: .7rem; font-size: .92rem; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; counter-reset: step; }
.timeline li { position: relative; padding: 0 0 .7rem 2.1rem; counter-increment: step; }
.timeline li::before { content: counter(step); position: absolute; left: 0; top: .1rem; width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid var(--moon); color: var(--moon); font-size: .8rem; display: grid; place-items: center; }
.timeline li:not(:last-child)::after { content: ""; position: absolute; left: .75rem; top: 1.7rem; bottom: .1rem; width: 1px; background: var(--line); }
.timeline .ph { font-family: var(--display); font-weight: 700; margin-right: .5rem; }
.rps { width: 100%; max-width: 22rem; height: auto; align-self: center; display: block; }
.terms { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .5rem .9rem; margin: 0; }
.terms dt { font-weight: 700; white-space: nowrap; }
.terms dd { margin: 0; }
.rage { color: var(--rage); }
details.who { border-top: 1px solid var(--line); padding: .35rem .2rem; font-size: .9rem; }
details.who > summary { color: var(--bone); list-style: none; display: flex; justify-content: space-between; gap: .8rem; }
details.who > summary::-webkit-details-marker { display: none; }
details.who > summary .r::after { content: " ⓘ"; color: var(--mist); font-size: .8rem; }
details.who .tags { margin-top: .4rem; }
details.who.dead > summary { opacity: .45; text-decoration: line-through; }
.title-block { display: flex; flex-direction: column; gap: .4rem; padding-block: 1.2rem .4rem; }
.title-block .sub { font-family: var(--display); color: var(--moon); font-size: 1.05rem; }
@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade .35s ease-out; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}

<body>
<main id="app" aria-live="polite"></main>

<script>
// オールウルフ ゲームエンジン v2（3すくみ・太陽の石なし）
// UIに依存しない純粋なJS。端末回し版のページとDiscord Botの両方から同じものを使う想定。
// 状態(state)はただのJSONなので保存・復元・送受信がそのまま可能。
// 従来版（太陽の石・防衛と襲撃の2択）は engine.js に残している。

// ---- 夜の3すくみ ----
// 防衛 … 襲撃を防ぎ、襲撃者を「手負い」（次の夜に行動も防衛もできない）にする。狂襲は防げない。
// 襲撃 … 防衛していない相手を手負いにする。手負い・拘束中の相手、または同じ夜に2頭以上（別々の2人でも、ケルベロスの集中でも）から襲撃された相手は殺す。防衛はいくつの襲撃でも防ぎ、防がれた側は全員手負い。
// 狂襲 … 防衛は無効で、狙った相手を殺す。狙った相手がその夜に襲撃を選んでいたら外れ、自分が死ぬ。
// 同じ行動どうしの狙い合いは相殺（3人以上の輪も同じ。オプションで個別解決にできる）。

const ROLES = {
  CERBERUS: { name: 'ケルベロス', emoji: '🐕', flavor: '地獄の三頭の番犬', forte: '襲撃型',
    desc: '襲撃は最大3頭ぶん指名でき、複数人を一度に狙える。同じ相手に2頭以上を集中させると一撃で殺し、襲撃どうしの狙い合いにも競り勝つ。首が3つあるので、1頭防がれただけでは怯まない（2頭以上防がれると手負い）。',
    abils: ['襲撃を最大3頭', '集中すると一撃・競り勝つ', '1頭防がれても怯まない'], maxK: 3, tough: true },
  NIHON: { name: 'ニホンオオカミ', emoji: '🌕', flavor: '神格化された存在', forte: '防衛型',
    desc: '誰が誰に殺されたかを知る。その日の昼に1票も入らなかった夜は防衛が無敵になり、狂襲も噛み砕きも防いで、相手を手負いにする。',
    abils: ['死因が分かる', '無票の夜は防衛が無敵'], deathSeer: true, ironDefense: true },
  TINDALO: { name: 'ティンダロスの猟犬', emoji: '🔺', flavor: '時間と次元を超える猟犬', forte: '狂襲型',
    desc: '匂いで獲物を追う。狂襲は、狙った相手が別の誰かを襲いに出ていても外さず、冥界に潜んでいても仕留める。買収も効かない。ただし自分に向かってくる相手とはすれ違って外す。拘束不可。',
    abils: ['襲撃を選んだ相手にも狂襲を外さない', '冥界も貫く', '拘束不可'], sureAmbush: true, pierceUW: true, noBind: true },
  ANUBIS: { name: 'アヌビス', emoji: '⚖️', flavor: '冥界と現世を行き来する神', forte: '防衛型',
    desc: '夜に冥界へ潜ると、その夜の襲撃も狂襲も受けない（ティンダロスを除く）。冥界から自分を狙った者が見える。冥界から戻った次の夜は潜れない。冥界にいる間に残り1人になると敗北。拘束不可。',
    abils: ['冥界潜伏', '狙った者が分かる', '拘束不可'], canUW: true, noBind: true },
  FENRIR: { name: 'フェンリル', emoji: '🌑', flavor: '巨大で獰猛な終末の狼', forte: '狂襲型',
    desc: '巨体ゆえに一撃では倒れない。狂襲を外しても死なず、手負いで済む。',
    abils: ['狂襲を外しても手負いで済む'], softAmbush: true },
  OKURI: { name: '送り狼', emoji: '🎭', flavor: '親切を装って最後に殺す', forte: '襲撃型',
    desc: '拘束者を見送るふりをして殺す。自分が投票した相手が拘束されると、昼のうちに必ず殺す（拘束不可でも逃げられない）。この死は翌朝まで誰にも知られない。ただし見送りに出ているので、その夜は行動も防衛もできない。だまし討ち: 親切を装って近づくので、襲撃を防がれても、手負いにしても、相手には誰に襲撃されたか分からない。',
    abils: ['投票した相手が拘束されたら昼に殺す（その夜は動けない）', '襲撃しても正体がばれない'], masked: true, okuri: true },
  DAIGAKU: { name: '大卒人狼', emoji: '🎓', flavor: '頭がよく弁が立つ', forte: 'バランス型',
    desc: '全員の役職と能力（継承分も含む）を知っている。毎朝、前夜に全員が選んだ行動の種類（襲撃・狂襲・防衛など）が分かる。誰を狙ったかまでは分からない。',
    abils: ['全員の能力が分かる', '全員の前夜の行動が分かる'], knowsAll: true, actionSeer: true },
  JUNKETSU: { name: '純血の人狼', emoji: '🩸', flavor: '純粋な人狼', forte: 'バランス型',
    desc: '牙を立てた相手の能力をすべて引き継ぐ。殺した相手だけでなく、襲撃で手負いにした相手や、襲撃を防いだ相手からも奪う。',
    abils: ['牙を立てた相手の能力を継承'], absorbs: true, devour: true, gnaw: true },
  ZAIBATSU: { name: '財閥人狼', emoji: '💰', flavor: '金で解決する', forte: 'バランス型',
    desc: '夜に「買収」を選ぶと、自分を狙った者（襲撃・狂襲）が1人だけなら、その攻撃を襲撃者以外の好きな人物へ流せる。狙った者が2人以上なら、雇った用心棒が防衛として守る。ティンダロスには効かない。拘束不可。',
    abils: ['買収で攻撃を横流し', '流せなければ用心棒が防衛', '拘束不可'], canBribe: true, bribeGuard: true, noBind: true },
  YOUEN: { name: '妖艶人狼', emoji: '💋', flavor: '美貌で支持を集める', forte: 'バランス型',
    desc: '自分に入った票をすべて、自分が投票した人物へ移す。ただし票を投じた本人へは跳ね返せず、その票は自分に残る。',
    abils: ['被票を自分の投票先へ移す'], voteRedirect: true },
};
const ROLE_IDS = Object.keys(ROLES);
const FLAGS = ['maxK', 'noAmbush', 'noDefend', 'sureAmbush', 'pierceUW', 'pierceDefend', 'softAmbush', 'noCancel', 'cancelKing', 'canCrush', 'berserk', 'devour', 'tough', 'gnaw', 'bribeGuard', 'masked', 'berserkOthers', 'softOthers', 'bigFang',
  'unshakable', 'ironDefense', 'deathSeer', 'canUW', 'noBind', 'okuri', 'knowsAll', 'actionSeer', 'absorbs', 'canBribe', 'voteRedirect'];

const ACTION_LABEL = { kill: '襲撃', crush: '噛み砕き', ambush: '狂襲', defend: '防衛', underworld: '冥界', bribe: '買収', pass: '何もしない' };

const DEFAULT_OPTIONS = {
  votePublic: false,        // 誰が誰に投票したかを公開する
  killCycle: 'all_survive', // 能力差のない襲撃の循環: 'all_survive' 相殺（全員無事） / 'resolve' 個別に解決（全員手負い） / 'all_die' 全員死亡
  ambushCycle: 'all_survive', // 能力差のない狂襲の循環: 'all_survive' 相殺（全員無事） / 'resolve' 個別に解決（全員死亡）
  tieRule: 'none',          // 最多票が同数のとき: 'none' 拘束なし / 'runoff' 決選投票 / 'random' 抽選
  truce: true,              // 休戦の密約: 投票画面で休戦したい相手を1人選び、互いに選び合えばその夜は2人の間の攻撃が無効
  firstVote: false,         // 初日の拘束投票: false なら初日は拘束せず、投票画面では休戦だけを選ぶ（情報がないまま初夜に拘束されるのを避ける）
  revealRoleOnDeath: true,  // 死亡者の役職を公開する
  maxDays: null,            // この日数を超えたら引き分け（null で無制限）
  ambushRule: 'hunting',    // 狂襲が失敗する条件: 'hunting' 狙った相手がその夜に襲撃を選んでいた＝外れる（確定） / 'attacked' 自分が誰かに襲撃された / 'both' 両方
  ambushRecoil: false,      // 試験: 狂襲が成功しても反動で手負いになる
};


// ---------- 乱数（状態に保存して再現可能にする） ----------
function rand(state) {
  let t = (state.rng += 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffle(state, arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(state) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ---------- 参照用ヘルパー ----------
// 「〜できない」という制約は継承しない（純血が引き継ぐのは能力だけ）
const RESTRICTIONS = ['noAmbush', 'noDefend'];
function eff(p) {
  const e = { maxK: 1 };
  for (const rid of [p.role, ...(p.inherited || [])]) {
    const r = ROLES[rid];
    if (!r) continue;
    for (const f of FLAGS) {
      if (f === 'maxK') e.maxK = Math.max(e.maxK, r.maxK || 1);
      else if (r[f] && (rid === p.role || !RESTRICTIONS.includes(f))) e[f] = true;
    }
  }
  return e;
}
const P = (s, id) => s.players.find(p => p.id === id);
const nameOf = (s, id) => P(s, id)?.name ?? '?';
// 本人や他プレイヤーから見て「生きているように見える」人（送り狼に昼に殺された人は朝まで生きて見える）
const seemsAlive = p => p.alive || p.hiddenDead;
function note(s, id, text) { (s.notices[id] ||= []).push(text); }
// 本人に届く情報の構造化版（ボットやDiscord Botが読む）。文章の通知と同じタイミングで朝に見える。
//   { k: 'attackedBy', who } 自分を狙った者が分かった / { k: 'helpless', who } その人は次の夜に動けない（手負い）
function fact(s, id, f) { ((s.facts ||= {})[id] ||= []).push(f); }

// ---------- ゲーム生成 ----------
function createGame({ names, options = {}, seed, roles } = {}) {
  if (!names || names.length < 2 || names.length > 10) throw new Error('プレイヤーは2〜10人');
  const state = {
    v: 2,
    options: { ...DEFAULT_OPTIONS, ...options },
    rng: (seed ?? Math.floor(Math.random() * 2 ** 31)) >>> 0,
    day: 1,
    phase: 'intro',
    players: [],
    pending: {},       // 現在のフェーズの各自の入力
    notices: {},       // 次の朝に本人だけに見せる通知
    nightNotices: {},  // 夜の画面で本人だけに見せる通知
    bind: null,        // { announced: id|null, real: bool, reason }
    votes: null,       // { raw, effective, counts }
    dayKill: null,     // 送り狼の昼の殺害 { victim, by }
    lastNight: null,   // 直前の夜の公開結果
    log: [],           // GM用の完全なログ（公開しない）
    winner: undefined, // undefined=進行中 / id=勝者 / null=勝者なし
    endReason: null,
  };
  const pool = roles || shuffle(state, ROLE_IDS).slice(0, names.length);
  state.players = names.map((name, i) => ({
    id: i, name, role: pool[i], alive: true, hiddenDead: false, inherited: [], stunNight: null, lastAct: null,
  }));
  state.log.push(`開始: ${state.players.map(p => `${p.name}=${ROLES[p.role].name}`).join(' / ')}`);
  return state;
}

// ---------- フェーズ進行 ----------
// intro(公開) → morning(個別) → vote(個別) → voteResult(公開) → night(個別) → dawn(公開) → morning …
// 決選投票のあるとき: vote → voteResult(同票の発表) → runoff(個別) → voteResult → night
// 残り2人のときは投票しない: morning → voteResult(投票なしの発表) → night
const PRIVATE_PHASES = ['morning', 'vote', 'runoff', 'night'];

function participants(state) {
  if (state.phase === 'night') return state.players.filter(seemsAlive).map(p => p.id);
  if (['morning', 'vote', 'runoff'].includes(state.phase)) return state.players.filter(p => p.alive).map(p => p.id);
  return [];
}
function isPhaseComplete(state) {
  if (!PRIVATE_PHASES.includes(state.phase)) return true;
  return participants(state).every(id => state.pending[id] !== undefined);
}

function submit(state, id, action) {
  if (!PRIVATE_PHASES.includes(state.phase)) throw new Error('入力を受け付けるフェーズではない');
  if (!participants(state).includes(id)) throw new Error('このフェーズの参加者ではない');
  state.pending[id] = sanitize(state, id, action || {});
  return state;
}

function sanitize(state, id, a) {
  const others = new Set(state.players.filter(p => seemsAlive(p) && p.id !== id).map(p => p.id));
  if (state.phase === 'morning') return {};
  if (state.phase === 'vote') return {
    vote: others.has(a.vote) && voteHeld(state) ? a.vote : null,
    truce: state.options.truce && others.has(a.truce) ? a.truce : null };
  if (state.phase === 'runoff') return { vote: others.has(a.vote) && state.runoff.candidates.includes(a.vote) ? a.vote : null };
  const v = privateView(state, id).input;
  if (v.blocked || !v.modes.includes(a.type)) return { type: 'pass' };
  if (a.type === 'defend' || a.type === 'underworld') return { type: a.type };
  if (a.type === 'bribe') return others.has(a.to) ? { type: 'bribe', to: a.to } : { type: 'pass' };
  const t = (a.targets || []).filter(x => v.targets.includes(x)).slice(0, a.type === 'kill' ? v.maxK : 1);
  return t.length ? { type: a.type, targets: t } : { type: 'pass' };
}

function advance(state) {
  if (!isPhaseComplete(state)) throw new Error('まだ全員の入力が揃っていない');
  const ph = state.phase;
  const acts = state.pending;
  state.pending = {};
  if (ph === 'intro') state.phase = 'morning';
  else if (ph === 'morning') {
    state.notices = {}; state.facts = {};
    state.runoff = null;
    // 残り2人なら投票は必ず同票になるので行わない
    if (state.players.filter(p => p.alive).length <= 2) {
      state.votes = null; state.dayKill = null; state.nightNotices = {}; state.truce = {}; state.truceOffers = [];
      state.bind = { announced: null, real: false, reason: 'duel' };
      state.log.push(`D${state.day}昼: 残り2人のため投票なし`);
      state.phase = 'voteResult';
    } else state.phase = 'vote';
  }
  else if (ph === 'vote') resolveVote(state, acts);
  else if (ph === 'runoff') resolveRunoff(state, acts);
  else if (ph === 'voteResult') state.phase = state.bind?.reason === 'runoff' ? 'runoff' : 'night';
  else if (ph === 'night') resolveNight(state, acts);
  else if (ph === 'dawn') {
    if (state.winner !== undefined) state.phase = 'over';
    else { state.day += 1; state.phase = 'morning'; }
  }
  return state;
}

// ---------- 昼: 投票と拘束 ----------
function tallyVotes(state, raw) {
  const alive = state.players.filter(p => p.alive);
  // 妖艶: 自分に入った票を自分の投票先へ移す。ただし票を投じた本人へは跳ね返せない（その票は妖艶に残る）。移すのは1段だけ。
  const effective = {};
  for (const v of alive) {
    const t = raw[v.id] ?? null;
    effective[v.id] = t;
    if (t == null) continue;
    const r = P(state, t), dest = raw[t] ?? null;
    if (r && eff(r).voteRedirect && dest != null && dest !== v.id) effective[v.id] = dest;
  }
  const counts = Object.fromEntries(alive.map(p => [p.id, 0]));
  for (const t of Object.values(effective)) if (t != null && counts[t] != null) counts[t]++;
  return { raw, effective, counts };
}

const voteHeld = S => S.options.firstVote !== false || S.day > 1;
function topOf(counts) {
  const max = Math.max(0, ...Object.values(counts));
  return { max, top: Object.keys(counts).filter(k => counts[k] === max).map(Number) };
}
function resolveVote(state, acts) {
  const raw = Object.fromEntries(Object.entries(acts).map(([k, v]) => [+k, v.vote]));
  state.votes = tallyVotes(state, raw);
  state.runoff = null;
  state.dayKill = null;
  state.nightNotices = {};
  formTruces(state, Object.fromEntries(Object.entries(acts).map(([k, v]) => [+k, v.truce ?? null])));
  const { max, top } = topOf(state.votes.counts);
  if (!voteHeld(state)) { state.votes = null; state.bind = { announced: null, real: false, reason: 'first' }; }
  else if (max === 0) state.bind = { announced: null, real: false, reason: 'none' };
  else if (top.length > 1 && state.options.tieRule === 'runoff') {
    state.runoff = { candidates: top, counts: null };
    state.bind = { announced: null, real: false, reason: 'runoff' };
    state.log.push(`D${state.day}昼: 票=${JSON.stringify(state.votes.counts)} 同票のため決選投票（${top.map(id => nameOf(state, id)).join('、')}）`);
    state.phase = 'voteResult';
    return;
  }
  else if (top.length > 1 && state.options.tieRule === 'random') bindPlayer(state, top[Math.floor(rand(state) * top.length)], 'lot', raw);
  else if (top.length > 1) state.bind = { announced: null, real: false, reason: 'tie' };
  else bindPlayer(state, top[0], 'bound', raw);
  state.log.push(`D${state.day}昼: 票=${JSON.stringify(state.votes?.counts ?? null)} 拘束=${state.bind.announced == null ? 'なし' : nameOf(state, state.bind.announced) + (state.bind.real ? '' : '(無効)')}`);
  state.phase = 'voteResult';
}
// 休戦の密約: 互いに選び合った2人はその夜、互いへの攻撃が無効になる。片方だけの申し出は翌朝、選ばれた側に届く。
function formTruces(state, pick) {
  state.truce = {}; state.truceOffers = [];
  for (const [a, b] of Object.entries(pick)) {
    if (b == null) continue;
    if (pick[b] === +a) state.truce[a] = b;
    else state.truceOffers.push({ from: +a, to: b });
  }
  for (const [a, b] of Object.entries(state.truce)) (state.nightNotices[a] ||= []).push(`🤝 ${nameOf(state, b)} との休戦が成立した。今夜は互いの攻撃が無効になる`);
  const pairs = Object.entries(state.truce).filter(([a, b]) => +a < b);
  if (pairs.length) state.log.push(`D${state.day}昼: 休戦 ${pairs.map(([a, b]) => nameOf(state, +a) + '⇄' + nameOf(state, b)).join(' / ')}`);
}
function resolveRunoff(state, acts) {
  const raw = Object.fromEntries(Object.entries(acts).map(([k, v]) => [+k, v.vote]));
  const t = tallyVotes(state, raw);
  const counts = Object.fromEntries(state.runoff.candidates.map(id => [id, t.counts[id] || 0]));
  state.runoff = { ...state.runoff, raw, counts };
  const { max, top } = topOf(counts);
  if (max === 0 || top.length > 1) state.bind = { announced: null, real: false, reason: 'tie2' };
  else bindPlayer(state, top[0], 'bound', raw);
  state.log.push(`D${state.day}昼: 決選=${JSON.stringify(counts)} 拘束=${state.bind.announced == null ? 'なし' : nameOf(state, state.bind.announced) + (state.bind.real ? '' : '(無効)')}`);
  state.phase = 'voteResult';
}
function bindPlayer(state, id, reason, raw) {
  {
    const t = P(state, id);
    // 拘束不可の人物でも表向きは拘束されたように発表する。本人だけが無効化を知る。
    state.bind = { announced: t.id, real: !eff(t).noBind, reason };
    if (!state.bind.real) (state.nightNotices[t.id] ||= []).push('🔓 あなたは拘束を無効化した。周りからは拘束されたように見えている。');
    // 送り狼: 自分が投票した相手が拘束されたら、その昼のうちに殺す（拘束不可でも逃げられない）。決選投票なら決選での投票で判定
    for (const o of state.players.filter(p => p.alive && p.id !== t.id && eff(p).okuri)) {
      if (raw[o.id] === t.id) {
        t.alive = false; t.hiddenDead = true;
        state.dayKill = { victim: t.id, by: o.id };
        // 代償: 見送りに出ているので、その夜は行動も防衛もできない（手負いと同じ）
        o.stunNight = state.day;
        (state.nightNotices[o.id] ||= []).push(`🎭 見送るふりをして ${t.name} を仕留めた。今夜は戻れず、行動も防衛もできない`);
        state.log.push(`D${state.day}昼: 送り狼 ${o.name} が ${t.name} を殺害（翌朝まで秘匿）`);
        break;
      }
    }
  }
}

// ---------- 夜: 3すくみの解決 ----------
function rankOf(e) { return e.cancelKing ? 3 : (e.noCancel || e.heads >= 2) ? 2 : 1; }
const isStunned = (S, p) => p.stunNight === S.day;
const isBound = (S, p) => S.bind?.announced === p.id && S.bind.real;
function canActAtNight(S, p) {
  if (!p.alive) return false; // 秘匿中の死者も入力はするが無効
  if (S.bind?.announced === p.id && S.bind.real) return false;
  if (isStunned(S, p)) return false;
  return true;
}

function resolveNight(state, acts) {
  const S = state;
  const log = (t) => S.log.push(`D${S.day}夜: ${t}`);
  S.notices = {}; S.facts = {};
  for (const o of S.truceOffers || []) if (P(S, o.to).alive) { note(S, o.to, `🤝 昨日 ${nameOf(S, o.from)} があなたとの休戦を望んでいた`); fact(S, o.to, { k: 'truceOffer', who: o.from }); }
  const actors = S.players.filter(p => canActAtNight(S, p));
  const isActor = id => actors.some(p => p.id === id);
  const act = id => (isActor(id) ? acts[id] : null) || { type: 'pass' };
  const uw = new Set(actors.filter(p => act(p.id).type === 'underworld').map(p => p.id));
  const defending = new Set(actors.filter(p => act(p.id).type === 'defend').map(p => p.id));
  const hunting = new Set(actors.filter(p => ['kill', 'crush'].includes(act(p.id).type)).map(p => p.id));
  const crushing = new Set(actors.filter(p => act(p.id).type === 'crush').map(p => p.id));
  const stun = new Set();   // 次の夜に動けなくなる人
  const extra = [];         // 襲撃・狂襲以外での死 { victim, by }

  // 1. 攻撃の辺を作る（「拘束者」指名の解決と、同一対象への頭数の集計）
  let edges = [];
  for (const a of actors) {
    const ac = act(a.id);
    if (!['kill', 'crush', 'ambush'].includes(ac.type)) continue;
    const e = eff(a);
    const heads = {};
    for (const t of ac.targets) {
      heads[t] = (heads[t] || 0) + 1;
    }
    for (const [to, h] of Object.entries(heads)) {
      const crush = ac.type === 'crush';
      edges.push({ from: a.id, to: +to, kind: crush ? 'kill' : ac.type, crush, heads: h, cancelKing: e.cancelKing, noCancel: e.noCancel,
        pierceDefend: e.pierceDefend || crush, pierceUW: e.pierceUW, sureAmbush: e.sureAmbush, softAmbush: e.softAmbush, berserk: e.berserk, berserkOthers: e.berserkOthers,
        unshakable: e.unshakable, status: null, reason: '' });
    }
  }

  // 2. 買収（財閥）: 自分を狙った者がちょうど1人なら、その攻撃を襲撃者以外の指定先へ流す
  for (const b of actors.filter(p => act(p.id).type === 'bribe')) {
    const inc = edges.filter(e => e.to === b.id);
    const froms = [...new Set(inc.map(e => e.from))];
    const dest = act(b.id).to;
    if (froms.length === 0) { note(S, b.id, '💰 買収: 今夜あなたを狙う者はいなかった'); continue; }
    if (froms.length > 1) {
      if (eff(b).bribeGuard) { defending.add(b.id); note(S, b.id, '💰 買収: 狙ってきた者が複数いたので、雇った用心棒が守りに回った'); }
      else note(S, b.id, '💰 買収: 狙ってきた者が複数いたため買収できなかった');
      log(`${b.name} の買収失敗（複数）`); continue;
    }
    const e = inc[0];
    if (e.sureAmbush && e.kind === 'ambush') { note(S, b.id, '💰 買収: 金の通じない相手だった'); log(`${b.name} の買収失敗（ティンダロス）`); continue; }
    if (dest === e.from) { note(S, b.id, '💰 買収: 襲ってきた本人には流せない'); continue; }
    const same = edges.find(x => x !== e && x.from === e.from && x.to === dest && x.kind === e.kind);
    if (same) { same.heads += e.heads; edges = edges.filter(x => x !== e); }
    else e.to = dest;
    note(S, b.id, `💰 買収成功: あなたへの${ACTION_LABEL[e.kind]}を ${nameOf(S, dest)} へ流した`);
    log(`${b.name} が ${nameOf(S, e.from)} の${ACTION_LABEL[e.kind]}を ${nameOf(S, dest)} へ流した`);
  }

  // 2.5 休戦: 休戦相手への攻撃は無効（買収で流れてきた攻撃も同じ）
  const truce = S.truce || {};
  for (const e of edges) {
    if (truce[e.from] !== e.to) continue;
    e.status = 'fail'; e.reason = '休戦';
    note(S, e.from, `🤝 休戦中の ${nameOf(S, e.to)} への${ACTION_LABEL[e.kind]}は無効になった`);
    note(S, e.to, `🤝 休戦中の ${nameOf(S, e.from)} があなたを${ACTION_LABEL[e.kind]}で狙ったが、無効になった`);
    fact(S, e.to, { k: 'attackedBy', who: e.from });
  }

  // 3. 狂襲の失敗。送り狼は手負いで済む。ティンダロスは狙った相手以外からの襲撃では止まらない（旧案 'hunting' の分岐も残す）
  if (S.options.ambushRule === 'attacked' || S.options.ambushRule === 'both') for (const e of edges) {
    // 狂襲: 捨て身の大振りで隙だらけ。その夜に誰かから襲撃を受けると、届く前に倒れる
    if (e.kind !== 'ambush' || e.status) continue;
    if (crushing.has(e.to)) edges.filter(x => x.from === e.to && !x.status).forEach(x => { x.status = 'fail'; x.reason = '狂襲されて不発'; });
    // ティンダロスは狙った相手からの襲撃でしか止まらない
    const hitters = edges.filter(x => x.to === e.from && x.kind === 'kill' && !x.status && (!e.sureAmbush || x.from === e.to));
    // 試験 'both': 狙った相手が狩りに出ていても止まる（相手に返り討ちにされる）
    if (S.options.ambushRule === 'both' && !e.sureAmbush && hunting.has(e.to) && !hitters.some(x => x.from === e.to))
      hitters.push({ from: e.to, to: e.from, kind: 'kill', status: null });
    if (!hitters.length) continue;
    if (e.berserkOthers && !hitters.some(x => x.from === e.to)) e.berserk = true;
    if (e.berserk) {
      // フェンリル: 隙を突かれて倒れるが、狂襲はそのまま届く（相討ち）
      hitters.forEach(x => { extra.push({ victim: e.from, by: x.from }); x.status = 'fail'; x.reason = '凶暴化した相手を仕留めた'; note(S, x.from, `🌑 狂襲で隙だらけの ${nameOf(S, e.from)} を仕留めたが、相手は倒れながら喰らいついた`); });
      continue;
    }
    e.status = 'fail'; e.reason = '隙を突かれた';
    if (e.softAmbush || (eff(P(S, e.from)).softOthers && !hitters.some(x => x.from === e.to))) { stun.add(e.from); note(S, e.from, `🌑 狂襲の隙を突かれた。手負いになり次の夜は動けない`); }
    else hitters.forEach(x => { extra.push({ victim: e.from, by: x.from }); x.status = 'fail'; x.reason = '狂襲の隙を突いた'; note(S, x.from, `🌑 狂襲で隙だらけの ${nameOf(S, e.from)} を仕留めた`); });
  }
  else for (const e of edges) {
    if (e.kind !== 'ambush' || e.status || !hunting.has(e.to)) continue;
    // 噛み砕いている者は隙だらけで狂襲を避けられず、その夜の噛み砕きは不発になる
    if (crushing.has(e.to)) {
      edges.filter(x => x.from === e.to && !x.status).forEach(x => { x.status = 'fail'; x.reason = '狂襲されて不発'; });
      continue;
    }
    // ティンダロス: 匂いで追うので、狩りに出て動き回る相手にも外さない（自分に向かってくる相手とはすれ違って外す）
    if (e.sureAmbush && !edges.some(x => x.from === e.to && x.to === e.from && x.kind === 'kill' && !x.status)) continue;
    e.status = 'fail'; e.reason = '空振り';
    if (e.softAmbush) { stun.add(e.from); note(S, e.from, `🌑 ${nameOf(S, e.to)} は襲撃を選んでいて、狂襲は外れた。巨体ゆえ倒れずに済んだが、手負いになり次の夜は動けない`); }
    else { extra.push({ victim: e.from, by: e.from }); }
  }

  // 4. 同じ種類の相互指名（序列: 3 > 2（相殺不可・ケルベロス集中） > 1）
  for (const e of edges) {
    if (e.status || e.from === e.to) continue;
    const r = edges.find(o => !o.status && o.from === e.to && o.to === e.from && o.kind === e.kind);
    if (!r) continue;
    const a = rankOf(e), b = rankOf(r);
    if (a > b) { r.status = 'fail'; r.reason = '相殺負け'; }
    else if (b > a) { e.status = 'fail'; e.reason = '相殺負け'; }
    else if (a === 1) { e.status = r.status = 'fail'; e.reason = r.reason = '相殺'; }
    else { e.status = r.status = 'clash'; }
    log(`相互指名 ${nameOf(S, e.from)}⇄${nameOf(S, e.to)}（${ACTION_LABEL[e.kind]}） → ${e.status || 'ok'}/${r.status || 'ok'}`);
  }
  edges.forEach(e => { if (e.status === 'clash') e.status = null; });

  // 5. 3人以上の殺害循環。同じ種類で能力差のない循環だけオプションを適用し、差があれば個別解決
  for (const cyc of findCycles(edges.filter(e => !e.status && e.from !== e.to))) {
    const pure = cyc.every(e => e.kind === cyc[0].kind && rankOf(e) === 1 && !e.pierceDefend && !e.pierceUW && !e.sureAmbush);
    log(`循環 ${cyc.map(e => nameOf(S, e.from)).join('→')} ${pure ? `(${ACTION_LABEL[cyc[0].kind]}・能力差なし)` : '(能力差あり→個別解決)'}`);
    const rule = cyc[0].kind === 'ambush' ? S.options.ambushCycle : S.options.killCycle;
    if (pure && rule === 'all_survive') cyc.forEach(e => { e.status = 'fail'; e.reason = '循環'; });
    if (pure && rule === 'all_die') cyc.forEach(e => { e.status = 'ok'; e.forceKill = true; });
  }

  // 6. 個別解決（冥界 > 無敵防衛 > 防衛）
  const counts = S.votes?.counts || {};
  const blocks = [], gnawed = [];
  const uwSeen = {};
  for (const e of edges) {
    if (e.status) continue;
    const t = P(S, e.to);
    if (!t.alive) { e.status = 'fail'; e.reason = '対象不在'; continue; }
    if (e.from === e.to) { e.status = 'ok'; continue; }
    if (uw.has(t.id) && !e.pierceUW) { e.status = 'fail'; e.reason = '冥界'; (uwSeen[t.id] ||= []).push(e.from); continue; }
    if (defending.has(t.id)) {
      const iron = eff(t).ironDefense && S.votes != null && !(counts[t.id] > 0) && !(S.runoff?.counts?.[t.id] > 0);
      const blocked = iron || (e.kind === 'kill' && !e.pierceDefend);
      if (blocked) {
        e.status = 'fail'; e.reason = iron ? '無敵防衛' : '防衛';
        blocks.push({ e, t });
        continue;
      }
    }
    e.status = 'ok';
  }
  // 防がれた攻撃: 襲撃者は手負いになる（送り狼は怯まない。ケルベロスは2頭以上防がれたときだけ）
  const blockedHeads = {};
  for (const { e } of blocks) blockedHeads[e.from] = (blockedHeads[e.from] || 0) + e.heads;
  for (const { e, t } of blocks) {
    const a = eff(P(S, e.from));
    const shaken = !e.unshakable && (!a.tough || blockedHeads[e.from] >= 2);
    if (shaken) stun.add(e.from);
    if (a.gnaw && e.kind === 'kill') gnawed.push({ by: e.from, victim: t.id });
    const who = a.masked ? '誰か' : nameOf(S, e.from);
    note(S, t.id, `🛡 ${who}の${ACTION_LABEL[e.kind]}を防いだ。${shaken ? '相手は手負いになり、次の夜は動けない' : '相手は怯まなかった'}`);
    if (!a.masked) fact(S, t.id, { k: 'attackedBy', who: e.from });
    if (shaken) { if (!a.masked) fact(S, t.id, { k: 'helpless', who: e.from }); note(S, e.from, `🩹 ${nameOf(S, t.id)} に防がれて手負いになった。次の夜は動けない`); }
  }
  for (const [id, fs] of Object.entries(uwSeen)) [...new Set(fs)].forEach(f => fact(S, +id, { k: 'attackedBy', who: f }));
  for (const [id, fs] of Object.entries(uwSeen)) note(S, +id, `⚖️ 冥界から見ていた。あなたを狙ったのは ${[...new Set(fs)].map(f => nameOf(S, f)).join('、')}`);

  const wounds = []; // 手負いにした組（純血の捕食に使う）
  // 6.5 襲撃は手負いにするだけ。狂襲・噛み砕き・手負いの相手への襲撃・2頭以上の襲撃なら殺す
  {
    const byTarget = {};
    for (const e of edges) if (e.status === 'ok' && e.from !== e.to) (byTarget[e.to] ||= []).push(e);
    for (const [tid, es] of Object.entries(byTarget)) {
      const t = P(S, +tid);
      const heads = es.filter(e => e.kind === 'kill' && !e.crush).reduce((n, e) => n + e.heads, 0);
      const lethal = es.some(e => e.kind === 'ambush' || e.crush || e.forceKill || eff(P(S, e.from)).bigFang) || isStunned(S, t) || isBound(S, t) || heads >= 2;
      if (lethal) continue;
      es.forEach(e => { e.status = 'wound'; });
      stun.add(t.id);
      note(S, t.id, `🩹 ${es.map(e => (eff(P(S, e.from)).masked ? '誰か' : nameOf(S, e.from))).join('、')} に襲撃されて手負いになった。次の夜は動けない`);
      es.forEach(e => { if (!eff(P(S, e.from)).masked) fact(S, t.id, { k: 'attackedBy', who: e.from }); fact(S, e.from, { k: 'helpless', who: t.id }); wounds.push({ by: e.from, victim: t.id }); });
      es.forEach(e => note(S, e.from, `🩸 ${nameOf(S, t.id)} を手負いにした。次の夜、相手は動けない`));
    }
  }

  // 7. 死亡の確定（送り狼の昼の殺害もここで公になる）
  const causes = {};
  const add = (v, by) => { if (!(causes[v] ||= []).includes(by)) causes[v].push(by); };
  for (const e of edges.filter(x => x.status === 'ok')) add(e.to, e.from);
  for (const x of extra) add(x.victim, x.by);
  if (S.dayKill) add(S.dayKill.victim, S.dayKill.by);
  const deaths = Object.keys(causes).map(Number);
  for (const id of deaths) { const p = P(S, id); p.alive = false; p.hiddenDead = false; }

  if (S.options.ambushRecoil) for (const e of edges) if (e.kind === 'ambush' && e.status === 'ok' && P(S, e.from).alive) {
    stun.add(e.from); note(S, e.from, '🩹 狂襲の反動で手負いになった。次の夜は動けない');
  }
  // 8. 手負いと行動の記録
  for (const id of stun) { const p = P(S, id); if (p.alive) p.stunNight = S.day + 1; }
  for (const p of actors) p.lastAct = act(p.id).type;

  // 9. 純血の能力継承
  for (const j of S.players.filter(p => p.alive && eff(p).absorbs)) {
    const got = [];
    const eaten = Object.entries(causes).filter(([v, ks]) => +v !== j.id && ks.includes(j.id)).map(([v]) => +v);
    if (eff(j).devour) wounds.filter(w => w.by === j.id).forEach(w => { if (!eaten.includes(w.victim)) eaten.push(w.victim); });
    gnawed.filter(w => w.by === j.id).forEach(w => { if (!eaten.includes(w.victim)) eaten.push(w.victim); });
    for (const v of eaten) {
      const victim = P(S, v);
      for (const rid of [victim.role, ...victim.inherited]) if (rid !== j.role && !j.inherited.includes(rid)) { j.inherited.push(rid); got.push(rid); }
    }
    if (got.length) { note(S, j.id, `🩸 能力を継承した: ${got.map(r => ROLES[r].name).join('、')}`); log(`${j.name} が ${got.join(',')} を継承`); }
  }

  // 10. 情報系の通知
  for (const n of S.players.filter(p => p.alive && eff(p).deathSeer)) {
    if (!deaths.length) continue;
    const lines = deaths.map(v => `${nameOf(S, v)} ← ${causes[v].map(k => (k === v ? '自滅（狂襲を外した）' : nameOf(S, k))).join('、')}${S.dayKill?.victim === v ? '（昼）' : ''}`);
    note(S, n.id, `🌕 死因\n${lines.join('\n')}`);
  }
  for (const d of S.players.filter(p => p.alive && eff(p).actionSeer)) {
    const lines = S.players.filter(p => seemsAlive(p) || deaths.includes(p.id)).filter(p => p.id !== d.id)
      .map(p => `${p.name}: ${isActor(p.id) ? ACTION_LABEL[act(p.id).type] : '動けなかった'}`);
    note(S, d.id, `🎓 昨夜の行動\n${lines.join('\n')}`);
  }
  if (S.dayKill && P(S, S.dayKill.by).alive) note(S, S.dayKill.by, `🎭 昼のうちに ${nameOf(S, S.dayKill.victim)} を仕留めていた`);

  S.lastNight = { deaths, uw: [...uw] };
  edges.forEach(e => log(`${nameOf(S, e.from)}→${nameOf(S, e.to)} ${ACTION_LABEL[e.kind]}${e.heads > 1 ? `×${e.heads}` : ''}: ${e.status}${e.reason ? '(' + e.reason + ')' : ''}`));
  extra.forEach(x => log(x.victim === x.by ? `${nameOf(S, x.victim)} は狂襲を外して自滅` : `${nameOf(S, x.victim)} は ${nameOf(S, x.by)} に倒された`));
  if (stun.size) log(`手負い: ${[...stun].map(id => nameOf(S, id)).join('、')}`);

  // 11. 勝敗判定
  const alive = S.players.filter(p => p.alive);
  if (alive.length === 0) { S.winner = null; S.endReason = '全滅'; }
  else if (alive.length === 1) {
    if (uw.has(alive[0].id)) { S.winner = null; S.endReason = `${alive[0].name} は冥界に潜んだまま最後の1人になり敗北`; }
    else S.winner = alive[0].id;
  } else if (S.options.maxDays && S.day >= S.options.maxDays) { S.winner = null; S.endReason = `${S.options.maxDays}日経過で引き分け`; }

  S.bind = null; S.dayKill = null; S.nightNotices = {}; S.truce = {}; S.truceOffers = [];
  S.phase = 'dawn';
}

// 単純な有向閉路（長さ3以上）を辺の列として列挙する。人数は最大10人なので総当たりで十分。
function findCycles(edges) {
  const out = [];
  const nodes = [...new Set(edges.map(e => e.from))].sort((a, b) => a - b);
  for (const start of nodes) {
    const path = [];
    const onPath = new Set([start]);
    const dfs = (u) => {
      for (const e of edges.filter(x => x.from === u)) {
        if (e.to === start && path.length + 1 >= 3) out.push([...path, e]);
        else if (e.to > start && !onPath.has(e.to)) {
          onPath.add(e.to); path.push(e); dfs(e.to); path.pop(); onPath.delete(e.to);
        }
      }
    };
    dfs(start);
  }
  return out;
}

// ---------- 表示用ビュー（UIとBotはこれだけを見て描画する） ----------
function publicView(state) {
  const S = state, o = S.options;
  const v = { phase: S.phase, day: S.day, survivors: S.players.filter(seemsAlive).map(p => ({ id: p.id, name: p.name })) };
  if (S.phase === 'voteResult' && S.bind?.reason === 'duel') { v.bind = '残り2人のため投票はない'; v.noVote = true; }
  else if (S.phase === 'voteResult' && S.bind?.reason === 'first') { v.bind = '初日は拘束しない'; v.noVote = true; }
  else if (S.phase === 'voteResult') {
    const ro = S.runoff?.counts;
    if (ro) v.runoffCounts = S.runoff.candidates.map(id => ({ name: nameOf(S, id), n: ro[id] }));
    if (ro && o.votePublic) v.runoffVotes = S.players.filter(seemsAlive).map(p => ({ name: p.name, to: S.runoff.raw[p.id] != null ? nameOf(S, S.runoff.raw[p.id]) : null }));
    v.votes = o.votePublic
      ? S.players.filter(p => p.alive || p.hiddenDead).map(p => ({ name: p.name, to: S.votes.raw[p.id] != null ? nameOf(S, S.votes.raw[p.id]) : null }))
      : null;
    v.counts = o.votePublic ? null : S.players.filter(seemsAlive).map(p => ({ name: p.name, n: S.votes.counts[p.id] || 0 }));
    const b = S.bind;
    v.bind = b.reason === 'none' ? '投票がなかったため拘束はなし'
      : b.reason === 'tie' ? '同票のため拘束はなし'
      : b.reason === 'runoff' ? `同票のため決選投票（${S.runoff.candidates.map(id => nameOf(S, id)).join('、')}）`
      : b.reason === 'tie2' ? '決選投票も同票のため拘束はなし'
      : (b.reason === 'lot' ? '同票のため抽選で、' : '') + `${nameOf(S, b.announced)} を拘束した`;
  }
  if (S.phase === 'dawn' || S.phase === 'over') {
    v.deaths = (S.lastNight?.deaths || []).map(id => ({ name: nameOf(S, id), role: o.revealRoleOnDeath ? ROLES[P(S, id).role].name : null, roleId: o.revealRoleOnDeath ? P(S, id).role : null }));
    if (S.winner !== undefined) {
      v.result = S.winner == null ? (S.endReason || '勝者なし') : `${nameOf(S, S.winner)}（${ROLES[P(S, S.winner).role].name}）の勝利`;
      v.reveal = S.players.map(p => ({ name: p.name, role: ROLES[p.role].name, roleId: p.role, emoji: ROLES[p.role].emoji, alive: p.alive,
        inherited: p.inherited.map(r => ROLES[r].name), inheritedIds: [...p.inherited] }));
    }
  }
  return v;
}

function privateView(state, id) {
  const S = state, me = P(S, id), e = eff(me);
  const others = S.players.filter(p => seemsAlive(p) && p.id !== id).map(p => ({ id: p.id, name: p.name }));
  const r = ROLES[me.role];
  const v = {
    phase: S.phase, day: S.day, name: me.name,
    role: { id: me.role, name: r.name, emoji: r.emoji, flavor: r.flavor, desc: r.desc, abils: r.abils, forte: r.forte,
      inherited: me.inherited.map(x => ROLES[x].name) },
    notices: S.phase === 'morning' ? (S.notices[id] || []) : S.phase === 'night' ? (S.nightNotices[id] || []) : [],
    facts: S.phase === 'morning' ? (S.facts?.[id] || []) : [],
    intel: e.knowsAll ? S.players.map(p => ({ name: p.name, role: ROLES[p.role].name, roleId: p.role, emoji: ROLES[p.role].emoji,
      inherited: p.inherited.map(x => ROLES[x].name), inheritedIds: [...p.inherited], alive: seemsAlive(p) })) : null,
  };
  if (S.phase === 'morning') v.input = { kind: 'morning', choices: others };
  if (S.phase === 'vote') v.input = { kind: 'vote', choices: others, preset: null, bindVote: voteHeld(S), truce: !!S.options.truce };
  if (S.phase === 'runoff') v.input = { kind: 'runoff', choices: others.filter(o => S.runoff.candidates.includes(o.id)), preset: null };
  if (S.phase === 'night') {
    const boundMe = S.bind?.announced === id && S.bind.real;
    const blocked = !me.alive ? null : boundMe ? 'bound' : S.dayKill?.by === id ? 'away' : isStunned(S, me) ? 'stun' : null;
    const targets = others.map(o => o.id);
    const modes = ['kill'];
    if (e.canCrush) modes.push('crush');
    if (!e.noAmbush) modes.push('ambush');
    if (!e.noDefend) modes.push('defend');
    if (e.canUW && me.lastAct !== 'underworld') modes.push('underworld');
    if (e.canBribe) modes.push('bribe');
    v.input = { kind: 'night', truceWith: S.truce?.[id] ?? null, blocked, modes, uwLocked: e.canUW && me.lastAct === 'underworld', maxK: e.maxK, targets, choices: others,
      boundId: S.bind?.announced ?? null };
  }
  return v;
}

// v2 用のボット。人間と同じ情報（自分の個別画面と公開情報）だけで判断する。
// 使い方: const brain = makeBot(seed); brain.act(state, id) で submit に渡す行動を返す。


// 役職ごとの好み（選べない行動は自動で除かれる）
const STYLE = {
  // バランス型・型を無視した打ち方
  default:  { kill: 0.35, ambush: 0.30, defend: 0.35 },
  // 防衛型
  NIHON:    { kill: 0.25, ambush: 0.15, defend: 0.60 },
  ANUBIS:   { kill: 0.25, ambush: 0.10, defend: 0.25, underworld: 0.40 },
  // 襲撃型
  CERBERUS: { kill: 0.60, ambush: 0.10, defend: 0.30 },
  OKURI:    { kill: 0.55, ambush: 0.10, defend: 0.35 },
  // 狂襲型（純血はバランス型なので default）
  TINDALO:  { kill: 0.20, ambush: 0.50, defend: 0.30 },
  FENRIR:   { kill: 0.20, ambush: 0.50, defend: 0.30 },
  // バランス型
  ZAIBATSU: { kill: 0.30, ambush: 0.20, defend: 0.20, bribe: 0.30 },
};

function makeBot(seed = 1, { neutral = false } = {}) {
  let rng = (seed * 2654435761) % 2147483647 || 1;
  const r = () => ((rng = (rng * 48271) % 2147483647) / 2147483647);
  const any = a => a[Math.floor(r() * a.length)];
  const mem = { helpless: [], enemies: {}, lastVote: null, redirector: new Set(), offers: [] };
  const weighted = (w) => {
    const keys = Object.keys(w).filter(k => w[k] > 0);
    let x = r() * keys.reduce((s, k) => s + w[k], 0);
    for (const k of keys) { if ((x -= w[k]) <= 0) return k; }
    return keys[keys.length - 1];
  };
  const topEnemy = (ids) => {
    const c = ids.filter(id => mem.enemies[id]).sort((a, b) => mem.enemies[b] - mem.enemies[a]);
    return c[0];
  };

  return {
    mem,
    act(state, id) {
      const v = privateView(state, id), inp = v.input;
      const ids = inp.choices.map(c => c.id);
      if (inp.kind === 'morning') {
        mem.helpless = [];
        // 昨日の票の行方から「票を移す人物（妖艶）」を見抜く。公開される情報だけを使う
        const V = state.votes, me0 = mem.lastVote;
        if (V && me0 != null) {
          if (!state.options.votePublic) { if (!(V.counts[me0] > 0)) mem.redirector.add(me0); }
          else {
            const raw = {}; for (const t of Object.values(V.raw)) if (t != null) raw[t] = (raw[t] || 0) + 1;
            const top = Math.max(0, ...Object.values(raw)), leaders = Object.keys(raw).filter(k => raw[k] === top).map(Number);
            if (leaders.length === 1 && leaders[0] === me0 && !(V.counts[me0] >= top)) mem.redirector.add(me0);
          }
        }
        mem.lastVote = null;
        // 大卒は全員の役職を知っている
        if (v.intel) v.intel.forEach((p, i) => { if (p.role === ROLES.YOUEN.name || p.inherited.includes(ROLES.YOUEN.name)) mem.redirector.add(state.players[i].id); });
        for (const f of v.facts) {
          if (f.k === 'attackedBy') mem.enemies[f.who] = (mem.enemies[f.who] || 0) + 1;
          if (f.k === 'helpless') mem.helpless.push(f.who);
          if (f.k === 'truceOffer') mem.offers.push(f.who);
        }
        return {};
      }
      if (inp.kind === 'vote' || inp.kind === 'runoff') {
        // 票を移す人物に入れても自分の票が利用されるだけなので避ける
        const pool = ids.filter(x => !mem.redirector.has(x));
        const c = pool.length ? pool : ids;
        const foe = topEnemy(c);
        let vote = foe != null && r() < 0.6 ? foe : any(c);
        if (inp.kind === 'runoff') return { vote };
        if (!inp.bindVote) vote = null;
        mem.lastVote = vote;
        // 休戦: 申し出てくれた相手（敵でない）に応える。いなければ敵でない誰かに申し出る
        let truce = null;
        if (inp.truce) {
          const friendly = ids.filter(x => !mem.enemies[x]);
          const offered = mem.offers.filter(x => friendly.includes(x));
          if (offered.length && r() < 0.8) truce = offered[offered.length - 1];
          else if (friendly.length && r() < 0.6) truce = any(friendly);
        }
        mem.offers = [];
        return { vote, truce };
      }
      if (inp.blocked) return { type: 'pass' };
      const me = state.players[id], role = me.role;
      // 休戦相手を狙っても無効なので外す
      if (inp.truceWith != null && ids.length > 1) { const k = ids.indexOf(inp.truceWith); if (k >= 0) ids.splice(k, 1); }
      // 手負いの相手が分かっていれば仕留めに行く（相手は守れない）
      const prey = mem.helpless.filter(x => ids.includes(x));
      if (prey.length && r() < 0.85) {
        const targets = Array.from({ length: inp.maxK }, (_, i) => (i === 0 ? prey[0] : any(ids)));
        return { type: 'kill', targets };
      }
      const style = { ...(neutral ? { ...STYLE.default, ...(role === 'ANUBIS' ? { underworld: 0.2 } : {}), ...(role === 'ZAIBATSU' ? { bribe: 0.2 } : {}) } : (STYLE[role] || STYLE.default)) };
      if (!neutral && eff(me).ironDefense && !(state.votes?.counts?.[id] > 0)) style.defend = 0.8; // 無票なら無敵防衛
      for (const k of Object.keys(style)) if (!inp.modes.includes(k)) delete style[k];
      if (!Object.keys(style).length) return { type: 'kill', targets: [any(ids)] };
      const mode = weighted(style);
      const foe = topEnemy(ids);
      const pickTarget = () => {
        if (inp.boundId != null && ids.includes(inp.boundId) && r() < 0.15) return inp.boundId; // 拘束者は襲撃1回で死ぬ
        return foe != null && r() < 0.5 ? foe : any(ids);
      };
      if (mode === 'kill') {
        const t = pickTarget();
        if (inp.maxK > 1) return { type: 'kill', targets: r() < 0.5 ? [t, t, any(ids)] : [t, any(ids), any(ids)] };
        return { type: 'kill', targets: [t] };
      }
      if (mode === 'ambush' || mode === 'crush') return { type: mode, targets: [pickTarget()] };
      if (mode === 'bribe') return { type: 'bribe', to: any(ids) };
      return { type: mode };
    },
  };
}

</script>
<script>
const PHASE_LABEL = { morning: '朝', vote: '昼・投票', runoff: '昼・決選投票', night: '夜' };
const $app = document.getElementById('app');
let ui = loadSaved() || { screen: 'setup', setup: { n: 5, names: Array(10).fill(''), options: { ...DEFAULT_OPTIONS }, dwell: 3, solo: false, myName: '' } };
const BOT_NAMES = ['ガルム', 'スコル', 'ハティ', 'ワーグ', 'ライカン', 'ルガルー', 'マルコシアス', 'バーゲスト', 'アモン'];
const BOTS = {}; // ボットの頭脳（記憶は保存しない。再読み込みすると忘れる）
const botFor = id => (BOTS[id] ||= makeBot((ui.botSeed || 1) * 31 + id));
const solo = () => !!ui.game?.solo;
let draft = {};
let dwellTimer = null;

if (ui.setup) ui.setup.options = { ...DEFAULT_OPTIONS, ...ui.setup.options };
function save() { try { localStorage.setItem('allwolf2', JSON.stringify(ui)); } catch (e) {} }
function loadSaved() { try { return JSON.parse(localStorage.getItem('allwolf2') || 'null'); } catch (e) { return null; } }
window.claude?.hot?.snapshot?.(() => ui);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const h = (strings, ...vals) => strings.reduce((a, s, i) => a + s + (i < vals.length ? vals[i] : ''), '');

function go(screen) { ui.screen = screen; draft = {}; save(); render(); window.scrollTo(0, 0); }

// ---------- 進行 ----------
function startGame() {
  const s = ui.setup;
  let names, human = null;
  if (s.solo) {
    const me = (s.myName || '').trim() || 'あなた';
    human = Math.floor(Math.random() * s.n);
    const bots = BOT_NAMES.filter(b => b !== me).slice(0, s.n - 1);
    names = Array.from({ length: s.n }, (_, i) => (i === human ? me : bots.shift()));
  } else names = Array.from({ length: s.n }, (_, i) => (s.names[i] || '').trim() || `プレイヤー${i + 1}`);
  if (new Set(names).size !== names.length) { ui.setupError = '同じ名前のプレイヤーがいます'; render(); return; }
  ui.setupError = null;
  let roles;
  if (s.solo) {
    // ひとり用: あなたの役職は山札から引く。10種を一巡するまで同じ役職は来ない
    if (!Array.isArray(s.bag) || !s.bag.length) s.bag = shuffleJs(ROLE_IDS);
    const mine = s.bag.pop();
    const rest = shuffleJs(ROLE_IDS.filter(r => r !== mine)).slice(0, s.n - 1);
    roles = names.map((_, i) => (i === human ? mine : rest.shift()));
  }
  ui.game = createGame({ names, options: s.options, roles });
  ui.game.solo = s.solo; ui.game.human = human;
  ui.botSeed = Math.floor(Math.random() * 100000);
  for (const k of Object.keys(BOTS)) delete BOTS[k];
  go('public');
}
function shuffleJs(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// ひとり用: 人間が死んだあとは決着まで一気に進める
function fastForward() {
  const g = ui.game;
  let guard = 0;
  while (g.phase !== 'over' && guard++ < 400) {
    if (PRIVATE_PHASES.includes(g.phase)) for (const id of participants(g)) submit(g, id, botFor(id).act(g, id));
    advance(g);
    if (g.phase === 'dawn' && g.winner !== undefined) break;
  }
  go('public');
}
function afterPublic() {
  const g = ui.game;
  if (g.phase === 'over') { ui = { screen: 'setup', setup: ui.setup }; save(); render(); return; }
  advance(g);
  startPrivateOrPublic();
}
function startPrivateOrPublic() {
  const g = ui.game;
  if (!PRIVATE_PHASES.includes(g.phase)) return go('public');
  if (solo()) {
    // ボットは先に行動を決める（人間の入力は見ない）。人間が参加者でなければそのまま進む
    const ps = participants(g);
    for (const id of ps) if (id !== g.human) submit(g, id, botFor(id).act(g, id));
    if (!ps.includes(g.human)) { advance(g); return startPrivateOrPublic(); }
    ui.queue = [g.human]; ui.qi = 0; ui.dwellEnd = 0; draft = {};
    return go('private');
  }
  ui.queue = participants(g); ui.qi = 0; go('handoff');
}
function confirmPrivate(action) {
  const g = ui.game, id = ui.queue[ui.qi];
  submit(g, id, action);
  ui.qi++;
  if (ui.qi < ui.queue.length) go('handoff');
  else { advance(g); startPrivateOrPublic(); }
}

// ---------- 描画 ----------
function render() {
  clearInterval(dwellTimer);
  const s = ui.screen;
  $app.innerHTML = s === 'setup' ? setupView() : s === 'handoff' ? handoffView() : s === 'private' ? privateScreen() : publicScreen();
  $app.firstElementChild?.classList.add('fade');
  bind();
}

function rpsSvg() {
  // 矢印は「狙う向き」。✕は失敗。防衛は誰も狙わないので矢印を出さない
  const node = (x, y, label, cls) => `<circle cx="${x}" cy="${y}" r="30" fill="var(--night-3)" stroke="var(--${cls})" stroke-width="2"/><text x="${x}" y="${y + 6}" text-anchor="middle" font-size="17" font-family="var(--display)" font-weight="700" fill="var(--${cls})">${label}</text>`;
  const arrow = (x1, y1, x2, y2, cls) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--${cls})" stroke-width="2" marker-end="url(#ah-${cls})"/>`;
  const cross = (x, y) => `<circle cx="${x}" cy="${y}" r="9" fill="var(--night-2)"/><path d="M${x - 5} ${y - 5}L${x + 5} ${y + 5}M${x + 5} ${y - 5}L${x - 5} ${y + 5}" stroke="var(--bone)" stroke-width="2.5" stroke-linecap="round"/>`;
  const mk = cls => `<marker id="ah-${cls}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--${cls})"/></marker>`;
  const t = (x, y, str, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="13" fill="var(--mist)">${str}</text>`;
  return `<svg class="rps" viewBox="0 0 320 248" role="img" aria-label="矢印は狙う向き、✕は失敗。襲撃は防衛に防がれ、狂襲を手負いにする。狂襲は防衛を無視して殺すが、襲撃を選んだ相手には外れて自滅する。">
    <defs>${mk('blood')}${mk('rage')}</defs>
    ${arrow(249, 168, 182, 66, 'blood')}${cross(215, 117)}
    ${arrow(71, 168, 138, 66, 'rage')}
    ${arrow(235, 186, 86, 186, 'blood')}
    ${arrow(85, 206, 234, 206, 'rage')}${cross(160, 206)}
    ${t(229, 112, '防がれて', 'start')}${t(229, 130, '手負いになる', 'start')}
    ${t(92, 112, '防衛を', 'end')}${t(92, 130, '無視して殺す', 'end')}
    ${t(160, 176, '手負いにする')}
    ${t(160, 236, '外れて自滅')}
    ${node(160, 34, '防衛', 'ward')}${node(268, 196, '襲撃', 'blood')}${node(52, 196, '狂襲', 'rage')}
  </svg>`;
}

    <h3>ゲームの流れ</h3>

      <li><span class="ph">朝</span>前夜の結果のうち、自分だけに届く知らせを見る。</li>
      <li><span class="ph">昼</span>話し合ってから、拘束したい相手に投票し、休戦したい相手を選ぶ。最多票の1人が拘束される。初日は拘束しない。</li>
      <li><span class="ph">夜</span>行動を1つ選ぶ。拘束された人は何もできない。</li>
      <li><span class="ph">夜明け</span>死者が発表される。2人以上残っていれば朝に戻る。</li>
    </ol>

    <p>最多票が同数なら拘束はない（オプションで決選投票か抽選にできる）。残り2人になったら投票はない。</p>
    <h3>休戦</h3>
    <p>昼に休戦したい相手を1人選べる。互いに選び合っていたら休戦が成立し、その夜は2人の間の攻撃が無効になる。成立したことは当人2人だけに知らされる。</p>
    <p>片方だけが選んでいた場合は、選ばれた人に翌朝「休戦を望んでいた」と届く。休戦相手を攻撃しても無効で、狙ったことは相手に知られる。</p>

      <dt class="ward">防衛</dt><dd>襲撃を防ぎ、襲撃してきた者を手負いにして名前を知る。狂襲は防げない。</dd>

      <dt class="rage">狂襲</dt><dd>防衛は無効で、狙った相手を殺す。ただし狙った相手がその夜に襲撃を選んでいたら外れ、自分が死ぬ。</dd>
      <dt>手負い</dt><dd>次の夜は行動も防衛もできない。襲撃されて手負いになった人は、誰に襲撃されたかが分かる。</dd>
    </dl>
    <h3>役職</h3>
    ${ROLE_IDS.map(r => h`<div><h3>${ROLES[r].emoji} ${ROLES[r].name}</h3><p class="muted">${ROLES[r].desc}</p></div>`).join('')}

// 役職名をタップすると能力の要約が開く（大卒人狼の一覧や決着画面で使う）
function whoRow(p) {
  const ids = [p.roleId, ...(p.inheritedIds || [])].filter(Boolean);
  const tags = ids.flatMap(r => ROLES[r].abils.map(a => h`<span class="tag${r === p.roleId ? '' : ' inh'}">${r === p.roleId ? '' : ROLES[r].name + ': '}${a}</span>`)).join('');
  const tip = ids.flatMap(r => ROLES[r].abils).join(' / ');
  return h`<details class="who${p.alive ? '' : ' dead'}"><summary title="${esc(tip)}"><span>${esc(p.name)}</span><span class="r">${p.emoji} ${p.role}${p.inherited.length ? '（継承: ' + p.inherited.join('、') + '）' : ''}</span></summary><div class="tags">${tags}</div></details>`;

function handoffView() {

function roleBlock(v) {

function privateScreen() {
  const g = ui.game, id = ui.queue[ui.qi], v = privateView(g, id), inp = v.input;

function pickRow(choices, key, cls = '') {
  return h`<div class="row">${choices.map(c => h`<button class="chip ${cls}" data-pick="${key}" data-id="${c.id}" aria-pressed="${draft[key] === c.id}">${esc(c.name)}</button>`).join('')}</div>`;
}
function morningInput(inp) {
  return '<p class="muted">知らせを確認したら確定して、次の人へ渡す。</p>';
}
function runoffInput(inp) {
  return h`<section class="panel"><h3>決選投票</h3><p class="muted">同票だった相手の中から1人を選ぶ。もう一度押すと棄権。決選でも同票なら拘束はない。</p>

function voteInput(inp) {

    ${pickRow(inp.choices, 'vote')}</section>` : '<section class="panel"><h3>拘束の投票</h3><p class="muted">初日は拘束しない。</p></section>';
  const truce = inp.truce ? h`<section class="panel"><h3>休戦したい相手</h3><p class="muted">互いに選び合えば、今夜は2人の間の攻撃が無効になる。片方だけなら、相手に翌朝「休戦を望んでいた」と届く。もう一度押すと取り消し。</p>
    ${pickRow(inp.choices, 'truce', 'gold')}</section>` : '';
  return vote + truce;
}
const MODE_LABEL = { kill: '襲撃', crush: '噛み砕き', ambush: '狂襲', defend: '防衛', underworld: '冥界に潜る', bribe: '買収' };
function nightInput(inp) {
  if (inp.blocked) return h`<section class="panel"><h3>今夜は動けない</h3><p>${inp.blocked === 'bound' ? 'あなたは拘束されている。今夜は行動も防衛もできず、襲撃1回で死ぬ。' : inp.blocked === 'away' ? 'あなたは見送りに出ているため、今夜は行動も防衛もできない。' : 'あなたは手負いのため、今夜は行動も防衛もできない。'}</p></section>`;
  draft.mode ||= 'kill'; draft.targets ||= [];
  const role = privateView(ui.game, ui.queue[ui.qi]).role.id;
  const opts = inp.targets.filter(t => t !== inp.truceWith).map(t => ({ id: t, name: inp.choices.find(c => c.id === t).name + (t === inp.boundId ? '（拘束者）' : '') }));
  const heads = id => draft.targets.filter(x => x === id).length;
  const single = cls => h`<div class="row">${opts.map(o => h`<button class="chip ${cls}" data-head="${o.id}" aria-pressed="${heads(o.id) > 0}">${esc(o.name)}</button>`).join('')}</div>`;
  let body = '';
  if (draft.mode === 'kill') body = h`<p class="muted">防衛していない相手を手負いにする。相手が手負いか拘束中なら殺す。同じ夜に2人以上から襲撃された相手も死ぬ。防衛されると自分が手負いになる。${inp.maxK > 1 ? ` 最大${inp.maxK}頭。同じ相手を重ねて押すと集中（一撃で殺し、襲撃どうしの狙い合いにも競り勝つ）。割り当て ${draft.targets.length}/${inp.maxK}` : ''}</p>
    <div class="row">${opts.map(o => h`<button class="chip kill" data-head="${o.id}" aria-pressed="${heads(o.id) > 0}">${esc(o.name)}${heads(o.id) > 1 ? ' ×' + heads(o.id) : ''}</button>`).join('')}</div>
    ${inp.maxK > 1 ? '<button class="ghost" data-act="clearheads">割り当てをやり直す</button>' : ''}`;
  if (draft.mode === 'crush') body = h`<p class="muted">防衛は無効で、一撃で殺す。ただしこの夜に狂襲されると避けられず、噛み砕きも不発になる。</p>${single('kill')}`;
  if (draft.mode === 'ambush') body = h`<p class="muted">防衛は無効で、狙った相手を殺す。${role === 'TINDALO' ? '狙った相手が襲撃を選んでいても外さない。ただし相手があなたを襲撃していたら外れ、あなたが死ぬ。'
    : role === 'FENRIR' ? '狙った相手がその夜に襲撃を選んでいたら外れるが、死なずに手負いで済む。' : 'ただし狙った相手がその夜に襲撃を選んでいたら外れ、あなたが死ぬ。'}</p>${single('kill')}`;
  if (draft.mode === 'defend') body = '<p class="muted">襲撃を防ぎ、襲撃してきた者を手負いにして名前を知る。狂襲と噛み砕きは防げない。</p>';
  if (draft.mode === 'underworld') body = '<p class="muted">冥界に潜り、今夜の襲撃も狂襲も受けない（ティンダロスの狂襲だけは届く）。あなたを狙った者が分かる。次の夜は潜れない。潜んだまま最後の1人になると負け。</p>';
  if (draft.mode === 'bribe') body = h`<p class="muted">あなたを狙う者が1人だけなら、その攻撃を下の相手へ流す（狙ってきた本人には流せない）。狙う者が2人以上なら防衛になる。ティンダロスの狂襲は流せない。</p>${pickRow(inp.choices, 'to', 'gold')}`;
  const lockNote = inp.uwLocked ? '<p class="muted">昨夜冥界から戻ったので、今夜は潜れない。</p>' : '';
  const truceNote = inp.truceWith != null ? h`<p class="muted">🤝 ${esc(inp.choices.find(c => c.id === inp.truceWith)?.name || '')} とは休戦中なので狙えない。</p>` : '';
  return h`<section class="panel"><h3>今夜の行動</h3>${truceNote}<div class="row">${inp.modes.map(m =>
    h`<button class="chip" data-mode="${m}" aria-pressed="${draft.mode === m}">${MODE_LABEL[m]}</button>`).join('')}</div>${lockNote}${body}</section>`;
}

  return h`<div class="title-block"><span class="eyebrow">${g.day}日目 夜明け${all}</span>
    <h2>${v.deaths.length ? '夜が明けると、' + v.deaths.length + '人が倒れていた' : '誰も死ななかった'}</h2></div>
    ${v.deaths.length ? h`<section class="panel victims">${v.deaths.map(d => h`<div class="victim"><span class="blood">${esc(d.name)}</span><span class="muted"${d.roleId ? h` title="${esc(ROLES[d.roleId].abils.join(' / '))}"` : ''}>${d.role || '役職は伏せられている'}</span></div>`).join('')}</section>` : ''}
    ${over ? h`<section class="panel"><span class="eyebrow">決着</span><h2>${esc(v.result)}</h2>
      <div>${v.reveal.map(whoRow).join('')}</div>
      <details><summary>GMの記録をすべて見る</summary><div class="log">${esc(g.log.join('\n'))}</div></details></section>` : surv}
    <button class="primary" data-act="next">${over ? '新しいゲームへ' : solo() ? '朝へ' : '朝へ（端末を回す）'}</button>${over ? '' : ff}`;
}

// ---------- 入力 ----------
function bind() {
  $app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { ui.setup.n = +b.dataset.n; save(); render(); });
  $app.querySelectorAll('[data-name]').forEach(i => i.oninput = () => { ui.setup.names[+i.dataset.name] = i.value; save(); });
  $app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { ui.setup.options[b.dataset.opt] = JSON.parse(b.dataset.val); save(); render(); });
  $app.querySelectorAll('[data-cycle]').forEach(b => b.onclick = () => { ui.setup.options.killCycle = ui.setup.options.ambushCycle = b.dataset.cycle; save(); render(); });
  $app.querySelectorAll('[data-dwell]').forEach(b => b.onclick = () => { ui.setup.dwell = +b.dataset.dwell; save(); render(); });
  $app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const k = b.dataset.pick, id = +b.dataset.id; draft[k] = draft[k] === id ? null : id; rerenderKeepDwell();
  });
  $app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { draft.mode = b.dataset.mode; draft.targets = []; rerenderKeepDwell(); });
  $app.querySelectorAll('[data-head]').forEach(b => b.onclick = () => {
    const id = +b.dataset.head;
    const max = draft.mode === 'kill' ? privateView(ui.game, ui.queue[ui.qi]).input.maxK : 1;
    if (max === 1) draft.targets = draft.targets[0] === id ? [] : [id];
    else if (draft.targets.length < max) draft.targets.push(id);
    else draft.targets = draft.targets.filter(x => x !== id);
    rerenderKeepDwell();
  });
  $app.querySelectorAll('[data-solo]').forEach(b => b.onclick = () => { ui.setup.solo = b.dataset.solo === '1'; save(); render(); });
  $app.querySelectorAll('[data-myname]').forEach(i => i.oninput = () => { ui.setup.myName = i.value; save(); });
  const act = { start: startGame, ff: fastForward, next: afterPublic, reveal: () => { ui.screen = 'private'; draft = {}; ui.dwellEnd = Date.now() + ui.setup.dwell * 1000; save(); render(); },
    clearheads: () => { draft.targets = []; rerenderKeepDwell(); }, confirm: onConfirm };
  $app.querySelectorAll('[data-act]').forEach(b => b.onclick = act[b.dataset.act]);
  const c = document.getElementById('confirm');
  if (c) {
    const tick = () => { const left = Math.ceil(((ui.dwellEnd || 0) - Date.now()) / 1000); c.disabled = left > 0; c.textContent = left > 0 ? `確定する（${left}）` : '確定する'; if (left <= 0) clearInterval(dwellTimer); };
    tick(); dwellTimer = setInterval(tick, 250);
  }
}
function rerenderKeepDwell() { const y = window.scrollY; const d = draft; render(); draft = d; window.scrollTo(0, y); }
function onConfirm() {
  const kind = privateView(ui.game, ui.queue[ui.qi]).input.kind;
  if (kind === 'morning') return confirmPrivate({});
  if (kind === 'vote') return confirmPrivate({ vote: draft.vote ?? null, truce: draft.truce ?? null });
  if (kind === 'runoff') return confirmPrivate({ vote: draft.vote ?? null });
  const m = draft.mode || 'kill';
  if (m === 'kill') return confirmPrivate({ type: 'kill', targets: draft.targets || [] });
  if (m === 'ambush' || m === 'crush') return confirmPrivate({ type: m, targets: (draft.targets || []).slice(0, 1) });
  if (m === 'bribe') return confirmPrivate({ type: 'bribe', to: draft.to });
  confirmPrivate({ type: m });
}
const start = () => render();
window.claude?.hot?.ready ? window.claude.hot.ready(d => { if (d && d.screen) ui = d; start(); }) : start();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
